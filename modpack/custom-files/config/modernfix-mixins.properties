# cache_strongholds plante au demarrage a chaque partie enregistree par Flashback : le mixin de
# ModernFix suppose un vrai serveur Minecraft, alors que le "ReplayServer" de Flashback n'en est
# pas un (NullPointerException dans ServerLevel.wrapOperation$...$modernfix$setCachePath, "instance
# is null"). ModernFix complete automatiquement les autres cles manquantes avec ses valeurs par
# defaut au prochain lancement.
mixin.perf.cache_strongholds=false
